name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test .NET
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore GeoMap.sln

      - name: Build
        run: dotnet build GeoMap.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GeoMap.sln --configuration Release --no-build --verbosity normal

  verify-local-stack:
    name: Verify Docker Compose, API and PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 for dataset loading
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Prepare local-only environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start local stack
        run: docker compose up --detach --build

      - name: Wait for PostGIS and verify extension
        shell: bash
        run: |
          for attempt in {1..45}; do
            if docker compose exec -T database sh -ec \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT PostGIS_Version();"'; then
              sleep 2

              if docker compose exec -T database sh -ec \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT PostGIS_Version();"'; then
                exit 0
              fi
            fi

            sleep 2
          done

          docker compose logs database
          exit 1

      - name: Apply initial spatial migration
        run: |
          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < database/migrations/001_initial_spatial_model.up.sql

      - name: Verify spatial model
        run: |
          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < tests/integration/verify-spatial-model.sql

      - name: Verify migration rollback
        run: |
          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < database/migrations/001_initial_spatial_model.down.sql

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < tests/integration/verify-spatial-model-rollback.sql

      - name: Reapply initial spatial migration
        run: |
          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < database/migrations/001_initial_spatial_model.up.sql

      - name: Build dataset generator
        run: |
          dotnet restore tools/importer/GeoMap.DatasetGenerator/GeoMap.DatasetGenerator.csproj
          dotnet build tools/importer/GeoMap.DatasetGenerator/GeoMap.DatasetGenerator.csproj \
            --configuration Release \
            --no-restore

      - name: Load and verify SMALL dataset
        env:
          GEOMAP_DB_CONNECTION_STRING: Host=localhost;Port=5432;Database=geomap;Username=geomap;Password=change-me-local-only
        run: |
          dotnet run \
            --project tools/importer/GeoMap.DatasetGenerator/GeoMap.DatasetGenerator.csproj \
            --configuration Release \
            --no-build \
            -- \
            --size small \
            --seed 42 \
            --batch-size 250

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v expected_dataset=small -v expected_seed=42 -v expected_count=1000' \
            < tests/integration/verify-dataset.sql

      - name: Load and verify MEDIUM dataset
        env:
          GEOMAP_DB_CONNECTION_STRING: Host=localhost;Port=5432;Database=geomap;Username=geomap;Password=change-me-local-only
        run: |
          dotnet run \
            --project tools/importer/GeoMap.DatasetGenerator/GeoMap.DatasetGenerator.csproj \
            --configuration Release \
            --no-build \
            -- \
            --size medium \
            --seed 4242 \
            --batch-size 5000

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v expected_dataset=medium -v expected_seed=4242 -v expected_count=100000' \
            < tests/integration/verify-dataset.sql

      - name: Load, analyze and verify LARGE dataset
        shell: bash
        env:
          GEOMAP_DB_CONNECTION_STRING: Host=localhost;Port=5432;Database=geomap;Username=geomap;Password=change-me-local-only
        run: |
          /usr/bin/time --verbose \
            dotnet run \
              --project tools/importer/GeoMap.DatasetGenerator/GeoMap.DatasetGenerator.csproj \
              --configuration Release \
              --no-build \
              -- \
              --size large \
              --seed 424242 \
              --batch-size 10000

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ANALYZE network_features;"'

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v expected_dataset=large -v expected_seed=424242 -v expected_count=1000000' \
            < tests/integration/verify-dataset.sql

          docker compose exec -T database sh -ec \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < tests/integration/verify-large-dataset-database.sql

      - name: Verify API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Clean up
        if: always()
        run: docker compose down --volumes
