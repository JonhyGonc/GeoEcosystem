# Movido de apps/geoautoengine/.github/workflows/tests.yml no M2.3 (monorepo, DEC-ECO-0001).
# Roda só quando apps/geoautoengine/** ou este arquivo mudam; os comandos rodam dentro de apps/geoautoengine.
name: GeoAutoEngine — Full test suite

on:
  pull_request:
    paths:
      - "apps/geoautoengine/**"
      - ".github/workflows/geoautoengine-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/geoautoengine/**"
      - ".github/workflows/geoautoengine-tests.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/geoautoengine

jobs:
  all-tests:
    # O plugin só roda no Windows e alguns testes usam caminhos no formato do Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Exclui só os testes que dependem de pastas fora do repositório (../reference e
      # ../GeoAutoEngine.Legacy). Veja "Testes que dependem de dados externos" no README.
      - name: Run all tests except EXTERNAL
        run: >-
          dotnet test tests/GeoAutoEngine.Tests/GeoAutoEngine.Tests.csproj
          --configuration Release
          --filter "Category!=EXTERNAL"
          --logger "console;verbosity=normal"
