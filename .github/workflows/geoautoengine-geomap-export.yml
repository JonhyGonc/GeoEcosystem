# Movido de apps/geoautoengine/.github/workflows/geomap-export.yml no M2.3 (monorepo, DEC-ECO-0001).
# Roda só quando apps/geoautoengine/** ou este arquivo mudam; os comandos rodam dentro de apps/geoautoengine.
name: GeoAutoEngine — GeoMap exporter

on:
  pull_request:
    paths:
      - ".github/workflows/geoautoengine-geomap-export.yml"
      - "apps/geoautoengine/src/GeoAutoEngine.Application/GeoMapExport/**"
      - "apps/geoautoengine/src/GeoAutoEngine.Cad2026/GeoMapExport/**"
      - "apps/geoautoengine/src/GeoAutoEngine.Plugin/GeoMapExportCommands.cs"
      - "apps/geoautoengine/tests/GeoAutoEngine.Tests/GeoMapExportTests.cs"
      - "apps/geoautoengine/build/GeoAutoEngine.bundle/PackageContents.xml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/geoautoengine-geomap-export.yml"
      - "apps/geoautoengine/src/GeoAutoEngine.Application/GeoMapExport/**"
      - "apps/geoautoengine/src/GeoAutoEngine.Cad2026/GeoMapExport/**"
      - "apps/geoautoengine/src/GeoAutoEngine.Plugin/GeoMapExportCommands.cs"
      - "apps/geoautoengine/tests/GeoAutoEngine.Tests/GeoMapExportTests.cs"
      - "apps/geoautoengine/build/GeoAutoEngine.bundle/PackageContents.xml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/geoautoengine

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run GeoMap exporter tests
        run: >-
          dotnet test tests/GeoAutoEngine.Tests/GeoAutoEngine.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~GeoMapExportTests
